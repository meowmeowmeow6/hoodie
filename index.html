<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hey you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* ---- EDIT NOTHING HERE UNLESS YOU WANT TO. YOUR NOTES ARE AT THE BOTTOM. ---- */
  :root{
    --ink:#151221;
    --ink-soft:#241f36;
    --thread:#E9B44C;   /* the embroidery floss color */
    --blush:#E88D7D;
    --paper:#F2EDE4;
    --muted:#9a92ad;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"DM Mono",ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center;
    padding:2rem 1.5rem;
    overflow-x:hidden;
  }
  .card{width:100%;max-width:34rem;text-align:center}

  /* ---- the waveform: same shape you stitched on the pocket ---- */
  .wave{
    display:flex;align-items:center;justify-content:center;
    gap:3px;height:72px;margin-bottom:2.5rem;
  }
  .wave span{
    width:3px;border-radius:2px;
    background:var(--thread);
    height:6px;
    opacity:.85;
    animation:rise .5s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes rise{to{height:var(--h)}}

  .eyebrow{
    font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin-bottom:1.25rem;
    opacity:0;animation:fade .6s .5s forwards;
  }
  .note{
    font-family:"Instrument Serif",Georgia,serif;
    font-size:clamp(1.9rem,7vw,2.9rem);
    line-height:1.22;letter-spacing:-.01em;
    color:var(--paper);
    opacity:0;animation:fade .7s .7s forwards;
  }
  .note em{font-style:italic;color:var(--thread)}
  .sig{
    margin-top:2.75rem;font-size:.75rem;color:var(--muted);
    opacity:0;animation:fade .7s 1.1s forwards;
  }
  .sig b{color:var(--blush);font-weight:400}
  @keyframes fade{to{opacity:1}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-delay:0ms !important}
    .wave span{height:var(--h)}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="wave" id="wave" aria-hidden="true"></div>
    <p class="eyebrow">you tapped the pocket</p>
    <p class="note" id="note"></p>
    <p class="sig">— <b>C</b></p>
  </main>

<script>
/* =========================================================
   1. YOUR NOTES — add as many as you want. One is picked
      at random each time she taps. Wrap words in <em></em>
      to make them the thread color.
   ========================================================= */
const NOTES = [
  "I was already <em>thinking about you</em> when you tapped this.",
  "This is the part of the song where I <em>lose my nerve</em> and mean it anyway.",
  "Somewhere in the stitching is the sound of me <em>saying your name</em>.",
  "You're wearing four days of me <em>trying not to mess this up</em>.",
  "Wherever you're standing right now — I'd rather <em>be there</em>."
];

/* =========================================================
   2. YOUR NTFY TOPIC — change this to your own random topic.
      Then subscribe to the same topic in the ntfy app.
   ========================================================= */
const NTFY_TOPIC = "CHANGE-ME-to-something-random-9f2k";

/* --- draw the waveform --- */
const BARS = 47;
const wave = document.getElementById("wave");
for (let i = 0; i < BARS; i++) {
  const t = i / (BARS - 1);
  const env = Math.sin(Math.PI * t);                 // fade in and out at the ends
  const h = 6 + env * (16 + Math.random() * 50);     // swap for your real waveform data
  const bar = document.createElement("span");
  bar.style.setProperty("--h", h.toFixed(0) + "px");
  bar.style.animationDelay = (i * 14) + "ms";
  wave.appendChild(bar);
}

/* --- show a note --- */
document.getElementById("note").innerHTML =
  NOTES[Math.floor(Math.random() * NOTES.length)];

/* --- ping my phone --- */
fetch("https://ntfy.sh/" + NTFY_TOPIC, {
  method: "POST",
  body: "She just tapped the hoodie. Text her now.",
  headers: { "Title": "hoodie", "Tags": "yellow_heart", "Priority": "high" }
}).catch(() => {});
</script>
</body>
</html>
