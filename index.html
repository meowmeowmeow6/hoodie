<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hey you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151221;
    --ink-soft:#221d33;
    --thread:#E9B44C;
    --blush:#E88D7D;
    --paper:#F2EDE4;
    --muted:#9a92ad;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    background:var(--ink);color:var(--paper);
    font-family:"DM Mono",ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center;
    padding:2.5rem 1.25rem;
  }
  .card{width:100%;max-width:26rem;text-align:center}

  /* the waveform — same shape as the pocket */
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:60px;margin-bottom:2rem}
  .wave span{
    width:3px;border-radius:2px;background:var(--thread);height:5px;opacity:.85;
    animation:rise .5s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes rise{to{height:var(--h)}}

  .eyebrow{
    font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    margin-bottom:1rem;opacity:0;animation:fade .6s .45s forwards;
  }
  .note{
    font-family:"Instrument Serif",Georgia,serif;
    font-size:clamp(1.6rem,6.5vw,2.2rem);line-height:1.25;
    margin-bottom:2.5rem;opacity:0;animation:fade .7s .6s forwards;
  }
  .note em{font-style:italic;color:var(--thread)}
  @keyframes fade{to{opacity:1}}

  /* the buttons */
  .buttons{display:flex;flex-direction:column;gap:.6rem;opacity:0;animation:fade .7s .9s forwards}
  button{
    font-family:inherit;font-size:.95rem;font-weight:500;
    color:var(--paper);background:var(--ink-soft);
    border:1px solid rgba(233,180,76,.28);border-radius:999px;
    padding:1.05rem 1.25rem;cursor:pointer;
    transition:transform .12s ease,background .2s ease,border-color .2s ease,color .2s ease;
  }
  button:hover{border-color:rgba(233,180,76,.6)}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--thread);outline-offset:3px}
  button.sending{color:var(--muted)}
  button.sent{background:var(--thread);color:var(--ink);border-color:var(--thread)}
  button.failed{border-color:var(--blush);color:var(--blush)}
  button:disabled{cursor:default}

  .sig{margin-top:2.5rem;font-size:.72rem;color:var(--muted);opacity:0;animation:fade .7s 1.2s forwards}
  .sig b{color:var(--blush);font-weight:400}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-delay:0ms !important;transition:none !important}
    .wave span{height:var(--h)}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="wave" id="wave" aria-hidden="true"></div>
    <p class="eyebrow">you tapped the pocket</p>
    <p class="note" id="note"></p>
    <div class="buttons" id="buttons"></div>
    <p class="sig">— <b>C</b></p>
  </main>

<script>
/* ============================================================
   1. YOUR NTFY TOPIC
   ============================================================ */
const NTFY_TOPIC = "il0vemybeautiful_jordy_k7x2qm";

/* ============================================================
   2. THE BUTTONS
      label — what she sees on the button
      alert — what lands on your phone
      sent  — what the button says after she taps it
      tag   — emoji in your notification (ntfy emoji name)
      Add, remove, or reword as many as you want.
   ============================================================ */
const BUTTONS = [
  { label:"I miss you",         alert:"Jordy misses you.",            sent:"he knows",         tag:"pensive" },
  { label:"I love you",         alert:"Jordy loves you.",             sent:"he loves you too", tag:"yellow_heart" },
  { label:"Thinking about you", alert:"Jordy is thinking about you.", sent:"he felt it",       tag:"thought_balloon" },
  { label:"Call me",            alert:"CALL JORDY.",                  sent:"phone's ringing",  tag:"telephone" },
  { label:"Come home",          alert:"Jordy wants you home.",        sent:"on his way",       tag:"house" }
];

/* ============================================================
   3. THE OPENING LINES — one picked at random each tap
   ============================================================ */
const NOTES = [
  "I was already <em>thinking about you</em> when you tapped this.",
  "Somewhere in this stitching is the sound of me <em>saying your name</em>.",
  "You're wearing four days of me <em>trying not to mess this up</em>.",
  "Whatever you press, it <em>reaches me</em>."
];

/* ---------- waveform ---------- */
const BARS = 41, wave = document.getElementById("wave");
for (let i = 0; i < BARS; i++) {
  const env = Math.sin(Math.PI * (i / (BARS - 1)));
  const bar = document.createElement("span");
  bar.style.setProperty("--h", (5 + env * (14 + Math.random() * 40)).toFixed(0) + "px");
  bar.style.animationDelay = (i * 14) + "ms";
  wave.appendChild(bar);
}

/* ---------- note ---------- */
document.getElementById("note").innerHTML = NOTES[Math.floor(Math.random() * NOTES.length)];

/* ---------- buttons ---------- */
const wrap = document.getElementById("buttons");

BUTTONS.forEach(b => {
  const el = document.createElement("button");
  el.textContent = b.label;
  el.addEventListener("click", async () => {
    if (el.disabled) return;
    el.disabled = true;
    el.classList.add("sending");
    el.textContent = "sending…";
    if (navigator.vibrate) navigator.vibrate(12);

    try {
      const res = await fetch("https://ntfy.sh/" + NTFY_TOPIC, {
        method: "POST",
        body: b.alert,
        headers: { "Title": "Jordy", "Tags": b.tag, "Priority": "high" }
      });
      if (!res.ok) throw new Error(res.status);
      el.classList.remove("sending");
      el.classList.add("sent");
      el.textContent = b.sent + " ✓";
    } catch (err) {
      el.classList.remove("sending");
      el.classList.add("failed");
      el.textContent = "didn't send — tap again";
      el.disabled = false;
    }
  });
  wrap.appendChild(el);
});
</script>
</body>
</html>
